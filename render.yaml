services:
  - type: web
    name: homefinder-api
    runtime: node
    plan: free
    buildCommand: npm ci --prefix backend && npm ci --include=dev --prefix frontend && npm run build --prefix frontend
    startCommand: npm start --prefix backend
    healthCheckPath: /api/health
    envVars:
      - { key: NODE_VERSION, value: 20 }
      - { key: NODE_ENV, value: production }
      - { key: MONGODB_URI, sync: false }
      - { key: JWT_SECRET, generateValue: true }
      - { key: ADMIN_EMAIL, sync: false }
      - { key: ADMIN_PASSWORD, sync: false }
      - { key: CLOUDINARY_CLOUD_NAME, sync: false }
      - { key: CLOUDINARY_API_KEY, sync: false }
      - { key: CLOUDINARY_API_SECRET, sync: false }
      - { key: AUTO_APPROVE, value: "false" }
      - { key: BREVO_API_KEY, sync: false }
      - { key: EMAIL_FROM_ADDRESS, sync: false }
      - { key: EMAIL_FROM_NAME, value: HomeFinder }
      - { key: VITE_GOOGLE_MAPS_KEY, sync: false }

